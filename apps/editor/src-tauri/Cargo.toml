[package]
name = "rpg-narrative-engine-editor"
version = "0.0.0"
description = "Filesystem host for RPG Narrative Engine Creator Studio"
authors = ["RPG Narrative Engine contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[lib]
name = "rpg_narrative_engine_editor"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
