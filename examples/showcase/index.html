<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A playable story built with the open-source RPG Narrative Engine."
    />
    <meta name="theme-color" content="#09151c" />
    <title>The Light at Brinewatch · RPG Narrative Engine</title>
  </head>
  <body>
    <main class="rpgne-shell showcase-shell">
      <header class="rpgne-header showcase-header">
        <a
          class="rpgne-brand engine-mark"
          href="https://github.com/zeidalidiez/RPGNarrativeEngine"
          aria-label="RPG Narrative Engine repository"
        >
          <span class="engine-glyph" aria-hidden="true">RNE</span>
          <span>RPG Narrative Engine</span>
        </a>
        <h1 id="story-title" class="rpgne-title">The Light at Brinewatch</h1>
        <p id="atmosphere" class="rpgne-version atmosphere" aria-live="polite">
          The storm is approaching
        </p>
      </header>

      <p class="showcase-dek">
        A keeper, a darkened beacon, and one hour before the mail ship reaches the rocks.
      </p>

      <div id="player" class="rpgne-player-frame player-frame"></div>

      <footer class="rpgne-footer showcase-footer">
        <p>
          Written in <code>.story</code>, compiled in the browser, and played by the same runtime
          intended for exported games.
        </p>
      </footer>
    </main>
    <noscript>This playable story requires JavaScript.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
